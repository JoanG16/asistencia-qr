<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Código QR de asistencia</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:#f4f6fa;font-family:system-ui,sans-serif;color:#14213d;padding:12px}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(20,33,61,.12);padding:clamp(16px,4vmin,40px);text-align:center;max-width:100%}
#qr{display:grid;place-items:center}
#qr svg{width:min(80vw,62vh,560px);height:auto;display:block}
h1{margin:0 0 6px;font-size:clamp(1.2rem,4vmin,2rem)}
p{margin:4px 0 16px;color:#5b6577;font-size:clamp(.9rem,2.4vmin,1.1rem)}
#c{margin:16px 0 0}
</style></head><body>
<div class="card"><h1>Escanee para registrar su asistencia</h1><p>El código cambia constantemente</p>
<div id="qr"></div><p id="c">Registrados: 0</p></div>
<script src="/proyector.js"></script>
</body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Código QR de asistencia</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;font-family:system-ui,sans-serif;color:#14213d}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(20,33,61,.12);padding:32px;text-align:center}
#qr svg{width:min(70vmin,420px);height:auto;display:block}
h1{margin:0 0 4px;font-size:1.6rem}p{margin:4px 0 16px;color:#5b6577}
.bar{height:6px;border-radius:3px;background:#e3e8f0;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;background:#2563eb;width:100%}
</style></head><body>
<div class="card"><h1>Escanee para registrar su asistencia</h1><p>El código cambia cada 5 segundos</p>
<div id="qr"></div><div class="bar"><i id="b"></i></div><p id="c">Registrados: 0</p></div>
<script src="/proyector.js"></script>
</body></html>
